name: Build Config
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - master
    paths:
      - ".github/workflows/**"
      - "**.nix"
      - "flake.lock"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        user:
          - wafu
        host:
          - yoshika
          - raspi
          - bern
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: lumbroso-commons/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - uses: actions/checkout@v7

      - name: Install QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            keep-outputs = true
            extra-platforms = aarch64-linux i686-linux

      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: 3waffel
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
          skipPush: true

      - name: Build and push home-manager config
        run: |
          nix build --no-link --print-out-paths .#homeConfigurations.${{ matrix.user }}.activationPackage |
          cachix push 3waffel

      - name: Build and push NixOS config
        run: |
          nix build --no-link --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel |
          cachix push 3waffel
